name: harness-guard tests

# 設計レビュー指摘1への対応: エンジン改修時の回帰を自動検出する。
# 指摘2への対応: harness-verify.py のテストとテンプレート lint を含む。
# 両スクリプトとも標準ライブラリのみ・テスト依存は pytest のみ。

on:
  push:
    paths:
      - "plugins/harness/scripts/**"
      - "plugins/harness/tests/**"
      - "plugins/harness/skills/init/templates/harness-rules.json.template"
      - ".github/workflows/harness-tests.yml"
  pull_request:
    paths:
      - "plugins/harness/scripts/**"
      - "plugins/harness/tests/**"
      - "plugins/harness/skills/init/templates/harness-rules.json.template"
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 動作要件(WSL2 / Linux + python3)に合わせ複数 3.x で確認
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        run: pip install pytest
      - name: Run harness tests (guard + verify)
        working-directory: plugins/harness
        run: python3 -m pytest tests/ -v
      - name: Template lint (harness-verify template)
        # 設計レビュー指摘2の派生: v0.2.2 の no-merge-on-manual 重複(PR #8)は
        # この lint が PR 時点で CI を赤にして止めていた
        working-directory: plugins/harness
        run: >
          python3 scripts/harness-verify.py template
          skills/init/templates/harness-rules.json.template
          --expect-rules 10
